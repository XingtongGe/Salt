# LongLive 5s + mixed-step SC-DMD + TRD alignment.
# local_attn_size/sink_size selects the LongLive SC-DMD rollout, 21 frames.
generator_ckpt: checkpoints/ode_init.pt
# generator_ckpt_key: generator_ema   # uncomment to load EMA weights
generator_fsdp_wrap_strategy: size
real_score_fsdp_wrap_strategy: size
fake_score_fsdp_wrap_strategy: size
real_name: wan_models/Wan2.1-T2V-14B
fake_name: wan_models/Wan2.1-T2V-1.3B
text_encoder_fsdp_wrap_strategy: size
denoising_step_list: [1000, 875, 750, 625, 500, 375, 250, 125]
warp_denoising_step: true
ts_schedule: false
num_train_timestep: 1000
timestep_shift: 5.0
guidance_scale: 3.0
denoising_loss_type: flow
mixed_precision: true
seed: 42
wandb_host: https://api.wandb.ai
wandb_key: null  # uses WANDB_API_KEY from the environment
wandb_entity: null  # uses the account default unless overridden
wandb_project: Salt
sharding_strategy: hybrid_full
lr: 2.0e-06
lr_critic: 4.0e-07
beta1: 0.0
beta2: 0.999
beta1_critic: 0.0
beta2_critic: 0.999
data_path: prompts/vidprom_filtered_extended.txt
batch_size: 1
ema_weight: 0.99
ema_start_step: 200
total_batch_size: 64
log_iters: 200
negative_prompt: '色调艳丽，过曝，静态，细节模糊不清，字幕，风格，作品，画作，画面，静止，整体发灰，最差质量，低质量，JPEG压缩残留，丑陋的，残缺的，多余的手指，画得不好的手部，画得不好的脸部，畸形的，毁容的，形态畸形的肢体，手指融合，静止不动的画面，杂乱的背景，三条腿，背景人很多，倒着走'
dfake_gen_update_ratio: 5
image_or_video_shape: [1, 21, 16, 60, 104]
distribution_loss: sc_dmd
trainer: score_distillation
gradient_checkpointing: true
num_frame_per_block: 3
load_raw_video: false
loop_rope_training: false

min_num_training_frames: 21
num_training_frames: 21
slice_last_frames: 21

model_kwargs:
  timestep_shift: 5.0
  model_name: wan_models/Wan2.1-T2V-1.3B
  local_attn_size: 12
  sink_size: 3

lambda_scfm: 0.2
consistency_mode: sde
num_segments: 4
scfm_mixed_step_lists: true
scfm_step_lists_8: [1000, 875, 750, 625, 500, 375, 250, 125]
scfm_step_lists_4: [1000, 750, 500, 250]
scfm_step_lists_2: [1000, 500]
scfm_step_probs: [0.4, 0.4, 0.2]

# Drift control: lambda_drift > 0 enables drift loss
# 4-step ref = 8-step, 2-step ref = random(4/8), 8-step = no drift
lambda_drift: 0.0
drift_mode: noise_aligned_b
drift_share_exit_input: false

# Ref alignment: MMD or spatial-only TRD (use ref_x0 as real)
# Set ref_align_loss: "trd" to replace MMD with TRD; "mmd" keeps current MMD.
ref_align_loss: "trd"
trd_margin: 0.1   # VideoREPA default; ReLU(|diff| - margin).mean()
trd_first_chunk_only: false   # true = only first chunk frames get TRD
mmd_weight: 0.1
mmd_use_ref: true
mmd_start_step: 1200
mmd_feature_timestep_min: 0
mmd_feature_timestep_max: 200
mmd_feature_block: 20
mmd_kernel: "linear"
mmd_sigma: 100
